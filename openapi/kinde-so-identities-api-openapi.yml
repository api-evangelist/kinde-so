openapi: 3.2.0
info:
  title: Kinde Management Identities API
  version: '1'
  description: The Kinde Management API programmatically manages a Kinde business - users, organizations, roles, permissions, feature flags, applications, connections, APIs and scopes, subscribers, properties, webhooks, and billing.
  contact:
    name: Kinde Support Team
    email: support@kinde.com
    url: https://docs.kinde.com
  termsOfService: https://docs.kinde.com/trust-center/agreements/terms-of-service/
servers:
- url: https://{subdomain}.kinde.com
  variables:
    subdomain:
      default: your_kinde_subdomain
      description: The subdomain generated for your business on Kinde.
security:
- kindeBearerAuth: []
tags:
- name: Identities
paths:
  /api/v1/identities/{identity_id}:
    get:
      tags:
      - Identities
      summary: Get identity
      operationId: GetIdentity
      description: 'Returns an identity by ID


        read:identities'
      parameters:
      - name: identity_id
        in: path
        required: true
        description: The unique identifier for the identity.
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Too many requests - rate limited
      security:
      - kindeBearerAuth: []
    patch:
      tags:
      - Identities
      summary: Update identity
      operationId: UpdateIdentity
      description: 'Update identity by ID.


        update:identities'
      parameters:
      - name: identity_id
        in: path
        required: true
        description: The unique identifier for the identity.
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Too many requests - rate limited
      security:
      - kindeBearerAuth: []
    delete:
      tags:
      - Identities
      summary: Delete identity
      operationId: DeleteIdentity
      description: 'Delete identity by ID.


        delete:identities'
      parameters:
      - name: identity_id
        in: path
        required: true
        description: The unique identifier for the identity.
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Too many requests - rate limited
      security:
      - kindeBearerAuth: []
components:
  securitySchemes:
    kindeBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Requires an access token obtained using the OAuth2 client_credentials flow from an authorized M2M application.

openapi: 3.2.0
info:
  title: Kinde Management Subscribers API
  version: '1'
  description: The Kinde Management API programmatically manages a Kinde business - users, organizations, roles, permissions, feature flags, applications, connections, APIs and scopes, subscribers, properties, webhooks, and billing.
  contact:
    name: Kinde Support Team
    email: support@kinde.com
    url: https://docs.kinde.com
  termsOfService: https://docs.kinde.com/trust-center/agreements/terms-of-service/
servers:
- url: https://{subdomain}.kinde.com
  variables:
    subdomain:
      default: your_kinde_subdomain
      description: The subdomain generated for your business on Kinde.
security:
- kindeBearerAuth: []
tags:
- name: Subscribers
paths:
  /api/v1/subscribers:
    get:
      tags:
      - Subscribers
      summary: List Subscribers
      operationId: GetSubscribers
      description: 'The returned list can be sorted by full name or email address

        in ascending or descending order. The number of records to return at a time can also be controlled using the `page_size` query

        string parameter.


        read:subscribers'
      parameters:
      - name: sort
        in: query
        description: Field and order to sort the result by.
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of results per page. Defaults to 10 if parameter not sent.
        schema:
          type: integer
      - name: next_token
        in: query
        description: A string to get the next page of results if there are more results.
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Too many requests - rate limited
      security:
      - kindeBearerAuth: []
    post:
      tags:
      - Subscribers
      summary: Create Subscriber
      operationId: CreateSubscriber
      description: 'Create subscriber.


        create:subscribers'
      parameters:
      - name: first_name
        in: query
        required: true
        description: Subscriber's first name.
        schema:
          type: string
      - name: last_name
        in: query
        required: true
        description: Subscriber's last name.
        schema:
          type: string
      - name: email
        in: query
        required: true
        description: The email address of the subscriber.
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Too many requests - rate limited
      security:
      - kindeBearerAuth: []
  /api/v1/subscribers/{subscriber_id}:
    get:
      tags:
      - Subscribers
      summary: Get Subscriber
      operationId: GetSubscriber
      description: 'Retrieve a subscriber record.


        read:subscribers'
      parameters:
      - name: subscriber_id
        in: path
        required: true
        description: The subscriber's id.
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Too many requests - rate limited
      security:
      - kindeBearerAuth: []
components:
  securitySchemes:
    kindeBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Requires an access token obtained using the OAuth2 client_credentials flow from an authorized M2M application.
